version: "3.1"
nlu:
- intent: afirmar
  examples: |
    - Así es
    - Sí, exacto
    - Eso mismo
- intent: agradecimiento
  examples: |
    - Ok, gracias
    - Perfecto, muchas gracias
    - Gracias por tu ayuda
- intent: ayuda_chatbot
  examples: |
    - ¿Qué puedes hacer?
    - ¿En qué me puedes ayudar?
    - ¿Qué tipo de consultas respondes?
- intent: certificado_defensa_civil
  examples: |
    - Quiero sacar el ITSE para mi negocio
    - ¿Cómo tramito mi certificado de seguridad en edificación?
    - ¿Dónde solicito la inspección de Defensa Civil?
- intent: certificado_posesion
  examples: |
    - Quiero formalizar la posesión de mi lote, ¿qué hago?
    - ¿Dónde solicito constancia de posesión?
    - ¿Cuánto demora el certificado de posesión?
- intent: constancia_domiciliaria
  examples: |
    - ¿Dónde tramito mi constancia de residencia?
    - Quiero un documento que acredite dónde vivo
    - ¿Cuánto cuesta la constancia domiciliaria?
- intent: constancia_no_adeudo
  examples: |
    - Quiero un documento que diga que estoy al día en mis pagos
    - ¿Cómo obtengo una constancia de no adeudo municipal?
    - Necesito comprobar que no tengo deudas con la MPSR
- intent: consulta_deuda_predial
  examples: |
    - ¿Tengo deuda pendiente de autoavalúo?
    - ¿Cómo sé si debo predial de este año?
    - Quisiera revisar mi deuda de impuesto predial
- intent: consulta_no_entendida
  examples: |
    - No entendí tu respuesta
    - ¿Puedes explicarlo de otra forma?
    - No me quedó claro lo que dijiste
- intent: contacto_telefonico
  examples: |
    - ¿Tienen un WhatsApp de atención?
    - ¿Cuál es el correo de la municipalidad?
    - ¿Cómo me comunico con la MPSR por teléfono?
- intent: copia_documento
  examples: |
    - Perdí mi copia, ¿cómo consigo otra?
    - ¿Puedo pedir copia certificada de una resolución?
    - ¿Qué costo tiene una copia certificada?
- intent: costos_generales
  examples: |
    - Quiero saber cuánto cuesta cada trámite
    - ¿Hay una lista de precios de trámites municipales?
    - ¿Dónde consulto las tasas municipales?
