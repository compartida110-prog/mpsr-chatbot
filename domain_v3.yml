# domain_v3.yml -- copia de domain.yml + intención nlu_fallback + utter_no_entendi (umbral de confianza, protocolo V1.2).
# domain.yml sigue siendo la línea base vigente; promover esta versión solo si el puntaje del umbral mejora en la
# validación real (ver scripts/fallback_threshold.py). Las respuestas de trámites siguen sin validar con el TUPA real.
# domain_v2.yml -- P09 completado (54/54 respuestas, ya no hay [PENDIENTE]).
#
# IMPORTANTE: las 44 respuestas de tramites (todo lo que no es conversacional:
# saludo, despedida, etc.) estan redactadas con informacion TIPICA de un TUPA
# municipal peruano, no con el TUPA real de la MPSR. Cada linea marcada con
# "[Verificar ...]" senala un dato que DEBE confirmarse con el TUPA oficial de
# la MPSR antes de usarse en el pre-piloto (P11.2) o de reportarse en la tesis.
# No se debe presentar este contenido como validado hasta hacer esa revision.
#
# Criterio de marcado: toda respuesta de tramite que afirma requisitos, tasas, plazos,
# oficinas, canales o formas de pago lleva su propia nota [Verificar ...] al final.
# Quedan sin nota solo 4 respuestas genericas o que remiten al TUPA: denuncia_seguridad_ciudadana,
# horario_recojo_basura, requisitos_generales y costos_generales.
version: '3.1'
intents:
- afirmar
- agradecimiento
- ayuda_chatbot
- certificado_defensa_civil
- certificado_posesion
- constancia_domiciliaria
- constancia_no_adeudo
- consulta_deuda_predial
- consulta_no_entendida
- contacto_telefonico
- copia_documento
- costos_generales
- denuncia_seguridad_ciudadana
- despedida
- estado_reclamo
- estado_tramite
- fraccionamiento_deuda
- fuera_de_alcance
- hablar_con_persona
- horario_atencion_general
- horario_mesa_partes
- horario_recojo_basura
- impuesto_alcabala
- inspeccion_tecnica
- libro_reclamaciones
- licencia_edificacion_costo
- licencia_edificacion_requisitos
- licencia_funcionamiento_costo
- licencia_funcionamiento_plazo
- licencia_funcionamiento_requisitos
- limpieza_via_publica
- mantenimiento_parques
- negar
- pago_arbitrios
- pago_predial_como
- partida_defuncion
- partida_matrimonio
- partida_nacimiento
- poda_arboles
- presentar_reclamo
- queja_atencion
- rectificacion_partida
- redes_sociales_mpsr
- renovacion_licencia
- repetir_informacion
- reporte_alumbrado_publico
- requisitos_defensa_civil
- requisitos_generales
- requisitos_matrimonio_civil
- requisitos_mesa_partes
- saludo
- serenazgo_contacto
- sugerencia
- ubicacion_oficinas
- nlu_fallback
responses:
  utter_licencia_funcionamiento_requisitos:
  - text: El TUPA pide una solicitud de licencia con carácter de declaración jurada y una declaración de cumplimiento de las condiciones de seguridad. Para riesgo bajo o medio, la ITSE se realiza después de otorgar la licencia; para riesgo alto o muy alto, se realiza antes y se adjuntan documentos técnicos, como croquis, planos y plan de seguridad. La municipalidad determina el nivel de riesgo y los requisitos exactos.
  utter_licencia_funcionamiento_costo:
  - text: 'El derecho de trámite depende del nivel de riesgo: S/ 169,80 (bajo), S/ 175,70 (medio), S/ 525,60 (alto) y S/ 893,70 (muy alto).'
  utter_licencia_funcionamiento_plazo:
  - text: 'Para riesgo bajo o medio, la licencia se emite en 2 días hábiles y la ITSE posterior se atiende hasta en 9 días hábiles. Para riesgo alto o muy alto, la ITSE previa puede tomar hasta 7 días y la licencia se emite en 1 día más: 8 días hábiles en total.'
  utter_licencia_edificacion_requisitos:
  - text: Los requisitos de licencia de edificación dependen de la modalidad (A, B, C o D), el tipo de obra y sus características. Dime qué proyecto vas a realizar, su uso y área para orientarte sobre la ficha que corresponde.
  utter_licencia_edificacion_costo:
  - text: El derecho de trámite de una licencia de edificación depende del procedimiento y la modalidad aplicable a la obra. Dime qué proyecto vas a realizar para identificar la ficha y su monto en el TUPA.
  utter_renovacion_licencia:
  - text: La licencia de funcionamiento tiene vigencia indeterminada y no requiere renovación. El certificado ITSE sí debe renovarse cada 2 años.
  utter_consulta_deuda_predial:
  - text: Puedes consultar tu deuda de impuesto predial presentando tu DNI en la Plataforma de Atención, o a través del número de tu autoavalúo si lo tienes a la mano. [Verificar canal y procedimiento de consulta con el TUPA vigente de la MPSR].
  utter_pago_predial_como:
  - text: El impuesto predial se puede pagar en caja de la municipalidad o en los bancos autorizados que tengan convenio con la MPSR. [Verificar si existe opción de pago en línea].
  utter_pago_arbitrios:
  - text: Los arbitrios municipales (limpieza pública, parques y jardines, serenazgo) se pagan junto con el impuesto predial o de forma independiente en caja de la municipalidad. [Verificar forma y lugar de pago con el TUPA vigente de la MPSR].
  utter_impuesto_alcabala:
  - text: El impuesto de alcabala se paga cuando compras un inmueble, y corresponde al 3% del valor de transferencia (con un tramo inicial inafecto equivalente a 10 UIT). Se cancela dentro del mes siguiente a la compra. [Verificar tasa, monto inafecto y plazo de pago con el TUPA y la normativa vigentes].
  utter_fraccionamiento_deuda:
  - text: El fraccionamiento de deuda tributaria es gratuito y de aprobación automática si presentas la documentación completa. Se requiere una solicitud que indique la deuda; si actúa un representante, un poder específico; y una declaración jurada de compromiso de pago con firma legalizada ante notario.
  utter_constancia_no_adeudo:
  - text: La constancia de no adeudo es un servicio exclusivo. Presenta una solicitud firmada por el titular de la propiedad o su representante legal e indica el número de pago. Cuesta S/ 18,40 y el plazo máximo es de 5 días hábiles.
  utter_requisitos_mesa_partes:
  - text: Los requisitos para presentar un documento dependen del procedimiento al que va dirigido. El TUPA no establece una lista única para todos los escritos. Dime qué trámite necesitas y reviso su ficha.
  utter_estado_tramite:
  - text: El portal oficial de la MPSR en gob.pe tiene un enlace directo llamado «Seguimiento de trámites». Lo encuentras en la sección de enlaces directos de la municipalidad.
  utter_horario_mesa_partes:
  - text: La sede central atiende de lunes a viernes, de 8:00 a. m. a 1:00 p. m. y de 2:00 p. m. a 4:00 p. m. Confirma con la municipalidad si la Mesa de Partes Virtual tiene un horario distinto.
  utter_copia_documento:
  - text: El servicio permite obtener copias certificadas de documentos que están en expedientes o archivos municipales. Presenta una solicitud con la información del documento e indica el número y la fecha del comprobante de pago. El costo varía por tamaño de hoja y el plazo es de hasta 15 días hábiles.
  utter_certificado_posesion:
  - text: La constancia de posesión se emite para acceder a agua, desagüe y electricidad. El TUPA pide solicitud, planos de ubicación/perimétrico/localización que cubran un radio de 550 metros, declaración jurada notarial de posesión, documento de propiedad, verificación del predio y visto bueno de la empresa prestadora. Cuesta S/ 85,80 y el plazo es de 10 días hábiles.
  utter_constancia_domiciliaria:
  - text: La constancia domiciliaria se tramita presentando tu DNI y un recibo de servicio (luz o agua) a tu nombre o de un familiar directo que viva contigo. [Verificar requisitos exactos con el TUPA vigente de la MPSR].
  utter_certificado_defensa_civil:
  - text: En el TUPA el trámite se denomina ITSE (Inspección Técnica de Seguridad en Edificaciones). El certificado tiene vigencia de 2 años; el procedimiento, los requisitos, el costo y el plazo dependen del nivel de riesgo del establecimiento.
  utter_inspeccion_tecnica:
  - text: La ITSE se solicita con el formato correspondiente y los documentos exigidos para el nivel de riesgo del establecimiento. Para riesgo bajo o medio es posterior al inicio de actividades; para riesgo alto o muy alto es previa. El costo y el plazo varían según la ficha.
  utter_requisitos_defensa_civil:
  - text: Los requisitos de ITSE dependen del nivel de riesgo. Para riesgo bajo o medio, el TUPA pide solicitud y declaración jurada de cumplimiento de condiciones de seguridad. Para riesgo alto o muy alto, también exige documentos técnicos, como croquis, planos, certificado de puesta a tierra, plan de seguridad y protocolos de mantenimiento.
  utter_denuncia_seguridad_ciudadana:
  - text: Para reportar un problema de seguridad ciudadana puedes comunicarte con serenazgo o acudir a la comisaría más cercana si se trata de una emergencia.
  utter_serenazgo_contacto:
  - text: Puedes comunicarte con serenazgo de la MPSR a través de su línea de atención. [Verificar número vigente con la municipalidad].
  utter_partida_nacimiento:
  - text: Para obtener una copia de una partida de nacimiento, paga el derecho de expedición de S/ 8,50. El plazo de atención del TUPA es de 1 día hábil.
  utter_partida_matrimonio:
  - text: Para obtener una copia de una partida de matrimonio, paga el derecho de expedición de S/ 8,50. El plazo de atención del TUPA es de 1 día hábil.
  utter_partida_defuncion:
  - text: Inscribir una defunción es distinto de pedir una copia del acta. La inscripción es gratuita, se atiende en 1 día hábil y los requisitos dependen del caso (defunción ordinaria, muerte violenta, mandato judicial o muerte presunta). La copia de una partida cuesta S/ 8,50 y se atiende en 1 día hábil.
  utter_rectificacion_partida:
  - text: El TUPA contempla la rectificación administrativa, judicial y notarial de partidas. La ficha pide el oficio judicial o parte notarial, la sentencia certificada o escritura pública correspondiente y el pago. El derecho es S/ 34,80 y el plazo de atención es de 5 días hábiles. La vía aplicable depende del caso.
  utter_requisitos_matrimonio_civil:
  - text: Para mayores de edad, el TUPA pide pliego matrimonial, partidas de nacimiento, certificados de domicilio, documentos de identidad de la pareja y testigos, pago por publicación del edicto y pago del trámite. Hay requisitos adicionales para divorciados, viudos o extranjeros. El plazo es de 15 días hábiles. La tarifa es S/ 125,30 en instalaciones municipales de lunes a viernes, S/ 220,00 en esas instalaciones sábados, domingos y feriados, o S/ 370,00 fuera de la municipalidad.
  utter_horario_recojo_basura:
  - text: El horario de recojo de basura varía según el sector de la ciudad. Puedes consultar el cronograma vigente en la municipalidad o en sus redes sociales.
  utter_reporte_alumbrado_publico:
  - text: Para reportar una falla de alumbrado público puedes comunicarte con el área de Servicios Públicos de la MPSR, indicando la ubicación exacta del poste o farola. [Verificar área responsable y procedimiento con el TUPA vigente de la MPSR].
  utter_mantenimiento_parques:
  - text: Puedes solicitar el mantenimiento de un parque presentando tu pedido en mesa de partes o comunicándote con el área de Servicios Públicos, indicando la ubicación del parque. [Verificar área responsable y procedimiento con el TUPA vigente de la MPSR].
  utter_poda_arboles:
  - text: La poda de árboles públicos se solicita ante el área de Servicios Públicos de la MPSR, indicando la ubicación exacta del árbol. [Verificar área responsable y procedimiento con el TUPA vigente de la MPSR].
  utter_limpieza_via_publica:
  - text: Para solicitar limpieza de una vía pública puedes comunicarte con el área de limpieza pública de la MPSR, indicando la calle y cuadra exacta. [Verificar área responsable y procedimiento con el TUPA vigente de la MPSR].
  utter_presentar_reclamo:
  - text: Puedes presentar un reclamo en mesa de partes, mediante un escrito simple indicando los hechos y adjuntando tu DNI, o a través del libro de reclamaciones si corresponde. [Verificar procedimiento con el TUPA vigente de la MPSR].
  utter_estado_reclamo:
  - text: El estado de tu reclamo puede consultarse en mesa de partes indicando tu número de expediente. [Verificar canal de consulta con el TUPA vigente de la MPSR].
  utter_libro_reclamaciones:
  - text: El libro de reclamaciones está disponible en la Plataforma de Atención; también puede existir una versión virtual. [Verificar si la MPSR cuenta con libro de reclamaciones virtual].
  utter_queja_atencion:
  - text: Si tuviste un problema con la atención recibida, puedes presentar tu queja en mesa de partes o directamente en el libro de reclamaciones, detallando lo ocurrido. [Verificar procedimiento con el TUPA vigente de la MPSR].
  utter_sugerencia:
  - text: Puedes dejar tu sugerencia en mesa de partes mediante un documento simple, o a través de los canales de atención ciudadana de la MPSR. [Verificar canal de recepción con la MPSR].
  utter_horario_atencion_general:
  - text: La sede central atiende de lunes a viernes, de 8:00 a. m. a 1:00 p. m. y de 2:00 p. m. a 4:00 p. m. Las agencias municipales pueden tener un horario distinto; confirma el horario de la sede que visitarás.
  utter_ubicacion_oficinas:
  - text: La sede central de la Municipalidad Provincial de San Román está en el Jr. Jáuregui N.° 321, Centro Cívico, referencia Plaza de Armas, Juliaca.
  utter_requisitos_generales:
  - text: Los requisitos dependen del trámite. Dime cuál necesitas y reviso los documentos que pide su ficha del TUPA.
  utter_costos_generales:
  - text: 'Los costos dependen de cada trámite: algunos son gratuitos y otros tienen un derecho específico indicado en el TUPA. Dime cuál necesitas y reviso el monto aplicable.'
  utter_contacto_telefonico:
  - text: La central telefónica de la Municipalidad Provincial de San Román es (051) 321201.
  utter_redes_sociales_mpsr:
  - text: La Municipalidad Provincial de San Román publica información e trámites en su página web institucional y en sus redes sociales oficiales. [Verificar enlaces vigentes].
  utter_saludo:
  - text: ¡Hola! Soy el asistente virtual de la MPSR. ¿En qué trámite te puedo ayudar hoy?
  utter_despedida:
  - text: ¡Gracias por tu consulta! Que tengas un buen día.
  utter_agradecimiento:
  - text: ¡Con gusto! ¿Hay algo más en lo que te pueda ayudar?
  utter_fuera_de_alcance:
  - text: Soy un asistente especializado en trámites de la MPSR, así que no puedo ayudarte con eso. ¿Tienes alguna consulta sobre un trámite municipal?
  utter_hablar_con_persona:
  - text: Entiendo. Puedes acercarte a la Plataforma de Atención al Ciudadano de la MPSR o llamar a nuestra central telefónica para hablar con un funcionario.
  utter_ayuda_chatbot:
  - text: Puedo ayudarte con consultas sobre licencias, tributos municipales, trámites documentarios, defensa civil, registro civil, servicios públicos, reclamos e información general de la MPSR.
  utter_consulta_no_entendida:
  - text: Disculpa, no entendí bien tu consulta. ¿Puedes reformularla, por favor?
  utter_repetir_informacion:
  - text: Claro, te repito la información anterior.
  utter_afirmar:
  - text: Perfecto, continuemos.
  utter_negar:
  - text: Entendido, dime en qué más te puedo ayudar.
  utter_no_entendi:
  - text: 'No estoy seguro de haber entendido tu consulta. ¿Puedes reformularla o decirme qué trámite necesitas?'
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
